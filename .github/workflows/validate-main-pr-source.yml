name: Validate main PR source branch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check head ref pattern
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" =~ ^(release|hotfix)/ ]]; then
            echo "OK: $HEAD_REF"
          else
            echo "NG: main へのマージ元は release/* または hotfix/* のみ許可されています（現在: $HEAD_REF）"
            exit 1
          fi
